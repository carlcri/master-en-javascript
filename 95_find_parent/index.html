<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery find</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <h1>Mi Lista de Tareas</h1>

    <div id="app-container">
        <ul id="task-list">
            <li class="task-item">
                <span class="task-text">Comprar víveres</span>
                <button class="mark-completed">Tarea 1</button>
            </li>
            <li class="task-item">
                <span class="task-text">Enviar informe semanal</span>
                <button class="mark-completed">Tarea 2</button>
            </li>
            <li class="task-item">
                <span class="task-text">Llamar al cliente XYZ</span>
                <button class="mark-completed">Tarea 3</button>
            </li>
            <li class="task-item">
                <span class="task-text">Planificar reunión de equipo</span>
                <button class="mark-completed">Tarea 4</button>
            </li>
        </ul>

        <hr>

        <h2>Acciones Rápidas</h2>
        <button id="highlight-second">Resaltar segunda tarea</button>
        <button id="show-parents-of-text">Mostrar padres del texto</button>
    </div>

    <script src="./JS/jquery-3.3.1.min.js"></script>
    <script src="./JS/95_find.js"></script>
</body>
</html>
