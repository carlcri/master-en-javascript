<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selectores JQuery</title>
</head>
<body>
    <h1>Selectores JQuery</h1>
    <p>Ejercicios Selectores ID</p>
    <div id="yellow">I am yellow</div>
    <div id="red">I am red</div>

    <hr>
    <p>Ejercicios Selectores de Clase</p>
    <div id="yellow" class="zebra">I am yellow and zebra</div>
    <div id="red" class="zebra">I am red and zebra</div>
    <div class="zebra">I am a zebra</div>

    <!--scripts-->
    <script src="./JS/jquery-3.3.1.min.js"></script>
    <script src="./JS/91_integrar.js"></script>
</body>
</html>
